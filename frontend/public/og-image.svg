<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="80%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#amberGlow)"/>

  <!-- Top Tricolor Accent Line -->
  <rect x="0" y="0" width="400" height="6" fill="#FF9933"/>
  <rect x="400" y="0" width="400" height="6" fill="#FFFFFF"/>
  <rect x="800" y="0" width="400" height="6" fill="#138808"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Platform Logo & Emblem (Left) -->
  <g transform="translate(90, 80)">
    <!-- Squircle container -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#0f172a" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
    <text x="50" y="68" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="56" fill="url(#goldText)" text-anchor="middle">Y</text>
  </g>

  <!-- Header Badge Pills -->
  <g transform="translate(210, 105)">
    <rect x="0" y="0" width="260" height="34" rx="17" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="130" y="22" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1.5">SMART INDIA HACKATHON · SIH26044</text>
  </g>
  <g transform="translate(490, 105)">
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4"/>
    <text x="100" y="22" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="1">MINISTRY OF AYUSH</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="255" font-family="'Outfit', system-ui, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
    Yuktha
  </text>
  <text x="330" y="255" font-family="'Outfit', system-ui, sans-serif" font-weight="700" font-size="44" fill="#cbd5e1" letter-spacing="-0.5">
    — Unified Collaboration Portal
  </text>

  <!-- Tagline Subtitle -->
  <text x="90" y="320" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="26" fill="#94a3b8">
    Bridging Ayush Students, Faculty &amp; Enterprises with Skill Intelligence
  </text>

  <!-- 4 Pillars Feature Cards (Bottom) -->
  <g transform="translate(90, 380)">
    <!-- Card 1: Students -->
    <rect x="0" y="0" width="240" height="150" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="0" y="0" width="240" height="4" fill="#10B981"/>
    <text x="24" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="17" fill="#34D399">01 · Ayush Students</text>
    <text x="24" y="78" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Diagnostic Assessments</text>
    <text x="24" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Radar Gap Benchmarks</text>
    <text x="24" y="126" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Verified Digital Portfolios</text>

    <!-- Card 2: Faculty -->
    <rect x="260" y="0" width="240" height="150" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="260" y="0" width="240" height="4" fill="#06B6D4"/>
    <text x="284" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="17" fill="#22D3EE">02 · Academicians</text>
    <text x="284" y="78" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Corporate Sabbaticals</text>
    <text x="284" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Joint Research RFPs</text>
    <text x="284" y="126" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Industry Consultancies</text>

    <!-- Card 3: Industry -->
    <rect x="520" y="0" width="240" height="150" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="520" y="0" width="240" height="4" fill="#3B82F6"/>
    <text x="544" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="17" fill="#60A5FA">03 · Enterprises</text>
    <text x="544" y="78" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Certified Masterclasses</text>
    <text x="544" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Clinical Internships</text>
    <text x="544" y="126" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Pre-Screened Talent</text>

    <!-- Card 4: Institutions -->
    <rect x="780" y="0" width="240" height="150" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="780" y="0" width="240" height="4" fill="#A855F7"/>
    <text x="804" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="17" fill="#C084FC">04 · Institutions</text>
    <text x="804" y="78" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Student Verifications</text>
    <text x="804" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">Curriculum Alignment</text>
    <text x="804" y="126" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#cbd5e1">National Analytics</text>
  </g>

  <!-- Bottom Gov Note -->
  <text x="90" y="585" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="13" fill="#64748b">
    Government of India · Ministry of Ayush · SIH26044 · HTTPS Encrypted &amp; DPDP 2023 Compliant
  </text>
</svg>
