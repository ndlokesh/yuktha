<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FFAA44"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- National Tricolor Accent Outer Ring -->
  <path d="M 28 8 A 56 56 0 0 1 100 8" fill="none" stroke="#FF9933" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 28 A 56 56 0 0 1 120 100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M 100 120 A 56 56 0 0 1 28 120" fill="none" stroke="#138808" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Subtle ambient glow -->
  <circle cx="64" cy="64" r="32" fill="#10B981" opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Medicinal Herb Leaf / Ayurvedic Lotus Motif behind Y -->
  <path d="M 64 24 C 74 36 84 50 78 64 C 72 78 64 82 64 82 C 64 82 56 78 50 64 C 44 50 54 36 64 24 Z" 
        fill="#10B981" opacity="0.22"/>
  <path d="M 64 26 C 70 38 78 48 74 58 C 70 68 64 74 64 74 C 64 74 58 68 54 58 C 50 48 58 38 64 26 Z" 
        fill="#34D399" opacity="0.3"/>

  <!-- Iconic Bold "Y" Monogram with Golden-Emerald Gradient -->
  <path d="M 40 38 L 56 65 L 56 94 Q 56 97 60 97 L 68 97 Q 72 97 72 94 L 72 65 L 88 38 Q 91 33 84 33 L 74 33 Q 70 33 67 38 L 64 45 L 61 38 Q 58 33 54 33 L 44 33 Q 37 33 40 38 Z"
        fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Center Chakra Sparkle Dot -->
  <circle cx="64" cy="40" r="3" fill="#FBBF24"/>
</svg>